name: Wikiball
options:
  bundleIdPrefix: com.wikiball
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  Wikiball:
    type: application
    platform: iOS
    sources:
      - Wikiball
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wikiball.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wikiball
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []
